  <div class="box">

  </div>
</div>

<script>
// This simply grabs the current URL parameters (like ?subid=99999 or ?zone=123)
// and adds them directly to your Monetag link.
// If there is no subid, it just goes to the link clean.

setTimeout(() => {
    let baseUrl = "https://omg10.com/4/10792509";
    // window.location.search contains the ? and everything after it
    let finalUrl = baseUrl + window.location.search;
    
    window.location.replace(finalUrl);
}, 800);
</script>
