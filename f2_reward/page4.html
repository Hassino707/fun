<script>
(function() {
  // Capture subid from URL
  const urlParams = new URLSearchParams(window.location.search);
  const subid = urlParams.get("subid") || "default";

  // Build redirect URL
  const redirectUrl = `https://omg10.com/4/10792509?subid=f2_${subid}`;

  // Auto redirect quickly
  setTimeout(() => {
    window.location.href = redirectUrl;
  }, 500); // faster than 1200ms

  // Fallback button function
  window.go = function() {
    window.location.href = redirectUrl;
  };
})();
</script>
