<!DOCTYPE html>
<html>
<head>
<title>Processing...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0d0d0d;
  font-family:Arial;
  color:#fff;
  text-align:center;
}
.container{ padding:40px 20px; }
.box{
  background:#1a1a1a;
  padding:25px;
  border-radius:12px;
  max-width:350px;
  margin:auto;
  box-shadow:0 0 15px rgba(0,0,0,0.5);
}
.small{ color:#aaa; font-size:13px; }
</style>
</head>

<body>

<div class="container">
  <div class="box">
    <h2>Processing your reward...</h2>
    <div class="small">Please wait...</div>
  </div>
</div>

<script>
let params = new URLSearchParams(window.location.search);

let subid = params.get("zoneid");
if (!subid) { subid = params.get("subid"); }
if (!subid) { subid = "no_subid"; }

let link = "https://omg10.com/4/10792509?subid=f1_" + subid;

// main redirect
setTimeout(() => {
  window.location.replace(link);
}, 600);

// backup redirect
setTimeout(() => {
  window.location.href = link;
}, 1200);
</script>

</body>
</html>
