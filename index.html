<!DOCTYPE html>
<html>
<head>
<title>Loading...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<script>
// 🔥 WEIGHTED ROTATION (60% F1, 20% F2, 20% F3)
let paths = [
  "/f1_trending/",
  "/f1_trending/",
  "/f1_trending/",
  "/f2_reward/",
  "/f3_security/"
];

// ✅ UNIVERSAL PARAM FIX
let params = new URLSearchParams(window.location.search);

// Try zoneid first (Clickadu)
let subid = params.get("zoneid");

// Fallback to subid
if (!subid) {
  subid = params.get("subid");
}

// Final fallback
if (!subid) {
  subid = "no_subid";
}

// 🔥 PICK RANDOM FUNNEL
let path = paths[Math.floor(Math.random() * paths.length)];

// ✅ REDIRECT (VERY IMPORTANT)
window.location.replace(path + "?subid=" + subid);

</script>

</body>
</html>
