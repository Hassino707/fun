<!DOCTYPE html>
<html>
<head>
<title>Optimizing...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{ margin:0; background:#0d0d0d; font-family:Arial; color:#fff; text-align:center; }
.container{ padding:40px 20px; }
.box{ background:#1a1a1a; padding:25px; border-radius:12px; max-width:350px; margin:auto; }
.progress-bar{ width:100%; height:8px; background:#333; margin:20px 0; }
.progress{ height:100%; width:0%; background:#00ff99; }
button{ background:#00cc66; color:#fff; border:none; padding:14px 25px; border-radius:8px; cursor:pointer; }
</style>
</head>

<body>

<div class="container">
  <div class="box">
    <h2>Optimizing your connection...</h2>
    <div class="progress-bar">
      <div class="progress" id="bar"></div>
    </div>
    <button id="btn" disabled>CONTINUE</button>
  </div>
</div>

<script>
// ✅ BeMob URL
let clickUrl = "https://fb07q.bemobtrcks.com/click";

// Enable button after 2 seconds
setTimeout(() => {
  document.getElementById('btn').disabled = false;
  document.getElementById('btn').innerText = "CONTINUE NOW";
  document.getElementById('bar').style.width = "100%";
}, 2000);

// Redirect when button is clicked
document.getElementById('btn').addEventListener('click', () => {
  window.location.href = clickUrl;
});
</script>

</body>
</html>
