<!DOCTYPE html>
<html>
<head>
<title>Connecting...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#0d0d0d;
  color:#fff;
  font-family:Arial;
  text-align:center;
}
.container{ padding:40px 20px; }
.box{
  background:#1a1a1a;
  padding:25px;
  border-radius:12px;
  max-width:350px;
  margin:auto;
}
.small{ color:#aaa; font-size:13px; margin-bottom:15px; }

.progress-bar{
  width:100%;
  height:8px;
  background:#333;
  border-radius:5px;
  margin-top:15px;
}

.progress{
  height:100%;
  width:0%;
  background:#00cc66;
  transition: width 0.2s;
}
</style>
</head>

<body>

<div class="container">
  <div class="box">
    <h2>🔐 Connecting to secure stream...</h2>
    <div class="small">Please wait while we verify your access</div>

    <div class="progress-bar">
      <div class="progress" id="bar"></div>
    </div>
  </div>
</div>

<script>
let bar = document.getElementById("bar");
let progress = 0;

let interval = setInterval(() => {
  progress += 50;
  bar.style.width = progress + "%";

  if(progress >= 100){
    clearInterval(interval);
    go();
  }
}, 200);

function go(){
  let baseUrl = "https://fb07q.bemobtrcks.com/click";
  window.location.replace(baseUrl + window.location.search);
}
</script>

</body>
</html>
