<script>
document.addEventListener("DOMContentLoaded", () => {

  const subid = new URLSearchParams(window.location.search).get("subid") || "default";
  const selectedOffer = "https://omg10.com/4/10792509?subid=f3_" + subid;

  let progress = 0;
  const bar = document.getElementById("progress");
  const btn = document.getElementById("btn");

  btn.disabled = true;

  const interval = setInterval(() => {
    progress += 25;

    if(progress >= 100){
      progress = 100;
      clearInterval(interval);
      btn.disabled = false;
    }

    bar.style.width = progress + "%";
  }, 200);

  function go(){
    window.location.href = selectedOffer;
  }

  btn.addEventListener("click", go);

  // Fast fallback
  setTimeout(go, 1200);
});
</script>
