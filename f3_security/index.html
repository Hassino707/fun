<script>
let subid = new URLSearchParams(window.location.search).get("subid") || "default";
let selectedOffer = "https://omg10.com/4/10792509?subid=f3_" + subid;

let progress = 0;
let bar = document.getElementById("progress");
let text = document.getElementById("text");
let btn = document.getElementById("btn");

btn.disabled = true;

let interval = setInterval(() => {
  progress += Math.random() * 20 + 10;
  if(progress >= 100){
    progress = 100;
    clearInterval(interval);
    text.innerHTML = "Ready ✔ Tap continue to proceed";
    btn.disabled = false;
  }
  bar.style.width = progress + "%";
}, 300);

let redirected = false;
function go(){
  if(redirected) return;
  redirected = true;
  window.location.href = selectedOffer;
}

btn.addEventListener("click", go);
setTimeout(go, 3000);
</script>
