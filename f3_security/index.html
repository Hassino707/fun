<!DOCTYPE html>
<html>

<head>
<title>Optimizing...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0d0d0d;
  font-family:Arial, sans-serif;
  color:#fff;
  text-align:center;
}

.container{ padding:40px 20px; }

.box{
  background:#1a1a1a;
  padding:25px;
  border-radius:12px;
  max-width:350px;
  margin:auto;
  box-shadow:0 0 15px rgba(0,0,0,0.5);
}

.small{
  font-size:13px;
  color:#aaa;
  margin-bottom:15px;
}

.progress-bar{
  width:100%;
  height:8px;
  background:#333;
  margin:20px 0;
  border-radius:5px;
  overflow:hidden;
}

.progress{
  height:100%;
  width:0%;
  background:#00ff99;
  transition: width 0.3s;
}

button{
  background: linear-gradient(45deg, #00ff99, #00cc66);
  color:#fff;
  border:none;
  padding:14px 25px;
  border-radius:8px;
  cursor:pointer;
  width:100%;
  font-weight:bold;
}

button:disabled{
  opacity:0.6;
}
</style>
</head>

<body>

<div class="container">
  <div class="box">

    <h2>Optimizing your connection...</h2>
    <div class="small">Please wait while we prepare your content</div>

    <div class="progress-bar">
      <div class="progress" id="bar"></div>
    </div>

    <button id="btn" disabled>PLEASE WAIT...</button>

  </div>
</div>

<script>

// 🔥 YOUR MONETAG LINK
let baseUrl = "https://omg10.com/4/10792509";

// Elements
let progress = 0;
let bar = document.getElementById("bar");
let btn = document.getElementById("btn");

// Progress animation
let interval = setInterval(() => {
  progress += 20;
  bar.style.width = progress + "%";

  if(progress >= 100){
    clearInterval(interval);
    btn.disabled = false;
    btn.innerText = "CONTINUE";
  }
}, 300);

// Redirect function (keeps tracking params)
function go(){
  let finalUrl = baseUrl + window.location.search;
  window.location.replace(finalUrl);
}

// Button click
btn.addEventListener("click", go);

// Auto redirect after progress completes
setTimeout(go, 5000);

</script>

</body>
</html>
