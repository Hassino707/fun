<!DOCTYPE html>
<html>
<head>
<title>Optimizing...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0d0d0d;
  font-family:Arial;
  color:#fff;
  text-align:center;
}
.container{
  padding:40px 20px;
}
.box{
  background:#1a1a1a;
  padding:25px;
  border-radius:12px;
  max-width:350px;
  margin:auto;
}
.progress-bar{
  width:100%;
  height:8px;
  background:#333;
  margin:20px 0;
}
.progress{
  height:100%;
  width:0%;
  background:#00ff99;
}
button{
  background:#00cc66;
  color:#fff;
  border:none;
  padding:14px 25px;
  border-radius:8px;
}
</style>

</head>

<body>

<div class="container">
  <div class="box">
    <h2>Optimizing your connection...</h2>

    <div class="progress-bar">
      <div class="progress" id="bar"></div>
    </div>

    <button id="btn" disabled>CONTINUE</button>
  </div>
</div>
<script>
// Automatically grab everything after the ? (like ?zoneid=99999)
// and attach it to the next page.
let next = "pageX.html" + window.location.search; 

// Auto-redirect after 800ms
setTimeout(() => {
    window.location.href = next;
}, 800);

// For your buttons (use onclick="go()")
function go() {
    window.location.href = next;
}
</script>

</body>
</html>
