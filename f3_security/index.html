<!DOCTYPE html>
<html>
<head>
<title>Optimizing...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{ 
  margin:0; 
  background:#0d0d0d; 
  font-family:Arial; 
  color:#fff; 
  text-align:center; 
}
.container{ padding:40px 20px; }
.box{ 
  background:#1a1a1a; 
  padding:25px; 
  border-radius:12px; 
  max-width:350px; 
  margin:auto; 
}
.progress-bar{ 
  width:100%; 
  height:8px; 
  background:#333; 
  margin:20px 0; 
}
.progress{ 
  height:100%; 
  width:0%; 
  background:#00ff99; 
  transition: width 0.3s;
}
button{ 
  background:#00cc66; 
  color:#fff; 
  border:none; 
  padding:14px 25px; 
  border-radius:8px; 
  cursor:pointer; 
}
button:disabled{
  opacity:0.6;
}
</style>
</head>

<body>

<div class="container">
  <div class="box">
    <h2>Optimizing your connection...</h2>

    <div class="progress-bar">
      <div class="progress" id="bar"></div>
    </div>

    <button id="btn" disabled>CONTINUE</button>
  </div>
</div>

<script>
// ✅ CAPTURE PARAMETERS (VERY IMPORTANT)
let params = new URLSearchParams(window.location.search);
let subid = params.get("subid") || params.get("zoneid") || "no_subid";

// ✅ BUILD BEMOB CLICK URL WITH SUBID
let clickUrl = "https://fb07q.bemobtrcks.com/click?subid=f3_" + subid;

// PROGRESS ANIMATION
let progress = 0;
let bar = document.getElementById("bar");

let interval = setInterval(() => {
  progress += 20;
  bar.style.width = progress + "%";

  if(progress >= 100){
    clearInterval(interval);

    // Enable button
    let btn = document.getElementById("btn");
    btn.disabled = false;
    btn.innerText = "CONTINUE NOW";
  }
}, 200);

// BUTTON CLICK
document.getElementById('btn').addEventListener('click', () => {
  window.location.href = clickUrl;
});

// ✅ AUTO REDIRECT (DON’T LOSE USERS)
setTimeout(() => {
  window.location.replace(clickUrl);
}, 1500);
</script>

</body>
</html>
