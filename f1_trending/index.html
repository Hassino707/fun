<!DOCTYPE html>
<html>
<head>
<title>Loading...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#0d0d0d;font-family:Arial;color:#fff;text-align:center;}
.container{padding:40px 20px;}
.box{background:#1a1a1a;padding:25px;border-radius:12px;max-width:350px;margin:auto;}
.small{font-size:13px;color:#aaa;}
</style>
</head>
<body>

<div class="container">
  <div class="box">
    <h2>Loading viral videos...</h2>
    <div class="small">Please wait while we fetch trending content</div>
  </div>
</div>

<script>
// ✅ UNIVERSAL PARAM FIX
let params = new URLSearchParams(window.location.search);

// Try zoneid first (Clickadu)
let subid = params.get("zoneid");

// Fallback to subid
if (!subid) {
  subid = params.get("subid");
}

// Final fallback
if (!subid) {
  subid = "no_subid";
}

// ✅ KEEP YOUR REDIRECT
setTimeout(() => {
  window.location.href = "page2.html?subid=" + subid;
}, 800);
</script>
  
</body>
</html>
