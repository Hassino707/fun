<!DOCTYPE html>
<html>
<head>
<title>Trending Now</title>
</head>
<body style="background:#0d0d0d; color:#fff; text-align:center; padding-top:50px;">

<h2>This video is trending 🔥</h2>
<p>Over 12,000 people are watching</p>

<button onclick="go()" style="padding:12px 20px;">WATCH NOW</button>

<script>
let subid = new URLSearchParams(window.location.search).get("subid") || "default";

// Auto redirect
setTimeout(() => {
  window.location.href = "page4.html?subid=" + subid;
}, 900);

// Button fallback
function go(){
  window.location.href = "page4.html?subid=" + subid;
}
</script>

</body>
</html>
