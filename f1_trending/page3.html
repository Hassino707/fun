<!DOCTYPE html>
<html>
<head>
<title>Trending Now</title>
</head>
<body style="background:#0d0d0d; color:#fff; text-align:center; padding-top:50px;">

<h2>🔥 This video is trending in your area</h2>
<div class="small">👁️ 12,847 people are watching right now</div>

<button onclick="go()">🔓 UNLOCK VIDEO</button>

<script>
let subid = new URLSearchParams(window.location.search).get("subid") || "default";

// Auto redirect
setTimeout(() => {
  window.location.href = "page4.html?subid=" + subid;
}, 900);

// Button fallback
function go(){
  window.location.href = "page4.html?subid=" + subid;
}
</script>

</body>
</html>
