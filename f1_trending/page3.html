<!DOCTYPE html>
<html>
<head>
<title>Trending Now</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{ margin:0; background:#0d0d0d; font-family:Arial; color:#fff; text-align:center; }
.container{ padding:40px 20px; }
.box{ background:#1a1a1a; padding:25px; border-radius:12px; max-width:350px; margin:auto; }
.small{ font-size:13px; color:#aaa; margin-bottom:20px; }
button{ background:#00cc66; color:#fff; border:none; padding:14px 25px; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>

<div class="container">
  <div class="box">
    <h2>🔥 This video is trending in your area</h2>
    <div class="small">👁️ 12,847 people are watching right now</div>
    <button onclick="go()">🔓 UNLOCK VIDEO</button>
  </div>
</div>

<script>
function go() {
    window.location.replace("page4.html" + window.location.search);
}

// Auto redirect
setTimeout(() => {
    window.location.replace("page4.html" + window.location.search);
}, 10000); // Increased time to 10s to give user a chance to click
</script>

</body>
</html>
