<!DOCTYPE html>
<html>
<head>
<title>Redirecting...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#0d0d0d;font-family:Arial;color:#fff;text-align:center;}
.container{padding:40px 20px;}
.box{background:#1a1a1a;padding:25px;border-radius:12px;max-width:350px;margin:auto;}
.small{color:#aaa;font-size:13px;}
</style>
</head>
<body>

<div class="container">
  <div class="box">
    <h2>Connecting to secure server...</h2>
    <div class="small">Please wait...</div>
  </div>
</div>

<script>
// 1. Get the subid from the URL
let params = new URLSearchParams(window.location.search);
let subid = params.get("subid") || "no_subid";

// 2. BeMob Click URL
// We append the subid to the BeMob click URL so BeMob captures it
let bemobClick = "https://fb07q.bemobtrcks.com/click?subid=f1_" + subid;

// 3. Redirect to BeMob, which then tracks the click and sends user to Monetag
setTimeout(() => {
    window.location.replace(bemobClick);
}, 600);
</script>
  
</body>
</html>
