<!DOCTYPE html>
<html>
<head>
<title>Redirecting...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#0d0d0d;font-family:Arial;color:#fff;text-align:center;}
.container{padding:40px 20px;}
.box{background:#1a1a1a;padding:25px;border-radius:12px;max-width:350px;margin:auto;}
.small{color:#aaa;font-size:13px;}
</style>
</head>
<body>

<div class="container">
  <div class="box">
    <h2>Connecting to secure server...</h2>
    <div class="small">Please wait...</div>
  </div>
</div>
<script>
// Automatically grab everything after the ? (like ?zoneid=99999)
// and attach it to the next page.
let next = "pageX.html" + window.location.search; 

// Auto-redirect after 800ms
setTimeout(() => {
    window.location.href = next;
}, 800);

// For your buttons (use onclick="go()")
function go() {
    window.location.href = next;
}
</script><script>

</html>
