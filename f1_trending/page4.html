<!DOCTYPE html>
<html>
<head>
<title>Redirecting...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#0d0d0d;font-family:Arial;color:#fff;text-align:center;}
.container{padding:40px 20px;}
.box{background:#1a1a1a;padding:25px;border-radius:12px;max-width:350px;margin:auto;}
.small{color:#aaa;font-size:13px;}
</style>
</head>
<body>

<div class="container">
  <div class="box">
    <h2>Connecting to secure server...</h2>
    <div class="small">Please wait...</div>
  </div>
</div>

<script>
// This simply grabs the current URL parameters (like ?subid=99999 or ?zone=123)
// and adds them directly to your Monetag link.
// If there is no subid, it just goes to the link clean.

setTimeout(() => {
    // UPDATED: Now points to your BeMob Click URL
    let baseUrl = "https://fb07q.bemobtrcks.com/click";
    
    // This preserves the tracking parameters (bemobdata, etc)
    let finalUrl = baseUrl + window.location.search;
    
    window.location.replace(finalUrl);
}, 800);
</script>
  
</body>
</html>
