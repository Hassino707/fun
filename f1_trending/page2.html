<!DOCTYPE html>
<html>
<head>
<title>Preparing...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#0d0d0d;font-family:Arial;color:#fff;text-align:center;}
.container{padding:40px 20px;}
.box{background:#1a1a1a;padding:25px;border-radius:12px;max-width:350px;margin:auto;}
.small{font-size:13px;color:#aaa;}
</style>
</head>
<body>

<div class="container">
  <div class="box">
    <h2>Preparing your experience...</h2>
    <div class="small">Optimizing videos for your device</div>
  </div>
</div>

<script>
// ✅ UNIVERSAL PARAM FIX
let params = new URLSearchParams(window.location.search);

let subid = params.get("zoneid");
if (!subid) { subid = params.get("subid"); }
if (!subid) { subid = "no_subid"; }

// ✅ PREVENT LOOP (CRITICAL FIX)
if (window.location.href.includes("page2.html") && !window.location.href.includes("redirected")) {
  
  // Add flag so it doesn't loop
  let nextUrl = "page3.html?subid=" + subid + "&redirected=1";

  setTimeout(() => {
    window.location.replace(nextUrl);
  }, 800);

}
</script>
  
</body>
</html>
